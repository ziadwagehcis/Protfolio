<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags (updated by JS from portfolioData.seo) -->
  <title>Ziad Wagih — Software Developer</title>
  <meta name="description" content="Portfolio of Ziad Wagih — Software Developer trained in MEAN Stack, .NET, and Flutter.">
  <meta name="keywords" content="Ziad Wagih, software developer, MEAN stack, angular, node.js, mongodb, asp.net, flutter, dart">
  <meta name="author" content="Ziad Wagih">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Ziad Wagih — Software Developer">
  <meta property="og:description" content="Portfolio of Ziad Wagih — Software Developer trained in MEAN Stack, .NET, and Flutter.">
  <meta property="og:image" content="assets/images/general/ziad-linkedin-banner.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ziad Wagih — Software Developer">
  <meta name="twitter:description" content="Portfolio of Ziad Wagih — Software Developer trained in MEAN Stack, .NET, and Flutter.">
  <meta name="twitter:image" content="assets/images/general/ziad-linkedin-banner.png">
  <meta name="twitter:creator" content="">

  <!-- Theme Color -->
  <meta name="theme-color" content="#6366f1">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <!-- Google Fonts: Preconnect + Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Inline Theme Script: Apply saved/system theme BEFORE first paint to avoid flash -->
  <script>
    (function() {
      var saved = localStorage.getItem('portfolio-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Skip to Content Link (Accessibility) -->
  <a href="#main-content" class="skip-link">Skip to Content</a>

  <!-- Loader -->
  <div id="loader" class="loader loader-overlay">
    <div class="loader-spinner"></div>
    <span class="loader-logo">ZW<span class="logo-dot">.</span></span>
  </div>

  <!-- Reading Progress Bar -->
  <div id="reading-progress" class="reading-progress" role="progressbar" aria-label="Reading progress"></div>

  <!-- Navigation -->
  <header id="navbar" class="navbar" role="banner"></header>

  <!-- Mobile Menu Backdrop Overlay -->
  <div id="mobile-menu-overlay" class="mobile-menu-overlay" aria-hidden="true"></div>

  <!-- Social Media Dock -->
  <aside id="social-dock" class="social-dock" aria-label="Social media links"></aside>

  <!-- Main Content -->
  <main id="main-content">

    <!-- Hero / Home Section -->
    <section id="home" class="hero-section" aria-label="Introduction">
      <div class="hero-bg">
        <div class="hero-grid-pattern"></div>
        <div class="hero-glow hero-glow-1"></div>
        <div class="hero-glow hero-glow-2"></div>
      </div>
      <canvas id="hero-particles" class="hero-particles" aria-hidden="true"></canvas>
      <div class="container hero-container" id="hero-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section section-alt" aria-label="About me">
      <div class="container" id="about-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Education Section -->
    <section id="education" class="section" aria-label="Education">
      <div class="container" id="education-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Experience Section -->
    <section id="experience" class="section section-alt" aria-label="Work experience">
      <div class="container" id="experience-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="section" aria-label="Technical skills">
      <div class="container" id="skills-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section section-alt" aria-label="Projects">
      <div class="container" id="projects-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Certifications Section -->
    <section id="certifications" class="section" aria-label="Certifications and achievements">
      <div class="container" id="certifications-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Services Section -->
    <section id="services" class="section section-alt" aria-label="Services">
      <div class="container" id="services-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Process Section -->
    <section id="process" class="section" aria-label="Development process">
      <div class="container" id="process-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials" class="section section-alt" aria-label="Testimonials">
      <div class="container" id="testimonials-content">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section" aria-label="Contact">
      <div class="container" id="contact-content">
        <!-- Populated by JS -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer id="footer" class="footer" role="contentinfo">
    <div class="container" id="footer-content">
      <!-- Populated by JS -->
    </div>
  </footer>

  <!-- Back to Top Button -->
  <button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox modal-overlay" role="dialog" aria-label="Image viewer" aria-hidden="true">
    <div class="lightbox-overlay"></div>
    <button class="modal-close lightbox-close" aria-label="Close image viewer">&times;</button>
    <button class="lightbox-prev" aria-label="Previous image">&#10094;</button>
    <button class="lightbox-next" aria-label="Next image">&#10095;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" class="lightbox-image" src="" alt="Enlarged view">
    </div>
  </div>

  <!-- Project Detail Modal -->
  <div id="project-modal" class="project-modal modal-overlay" role="dialog" aria-label="Project details" aria-hidden="true">
    <div class="modal-content" id="project-modal-body">
      <!-- Populated by JS when opened -->
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/portfolio-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
